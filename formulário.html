<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscrição</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

	<header class="topo">
		<div class="topo__interno">
			<a class="marca" href="index.html">Brasil</a>
			<nav class="menu" aria-label="Principal">
				<a href="index.html">Início</a>
				<a href="formulário.html" aria-current="page">Apoiador</a>
			</nav>
		</div>
	</header>

	<div class="hero hero--compacto">
		<div class="hero__conteudo">
			<h1>Cadastro de Apoiador da Seleção Brasileira</h1>
		</div>
	</div>

	<main class="folha">

		<form class="formulario">

			<div class="campo">
				<label for="nome">Nome Completo:</label>
				<input type="text" id="nome" name="nome" required>
			</div>

			<div class="campo">
				<label for="email">E-mail:</label>
				<input type="email" id="email" name="email" required>
			</div>

			<div class="campo">
				<label for="telefone">Telefone:</label>
				<input type="tel" id="telefone" name="telefone" required>
			</div>

			<div class="campo">
				<label for="cidade">Cidade:</label>
				<input type="text" id="cidade" name="cidade" required>
			</div>

			<div class="campo">
				<label for="plano">Plano de Apoio:</label>
				<select id="plano" name="plano" required>
					<option value="">Selecione um plano</option>
					<option value="bronze">Bronze</option>
					<option value="prata">Prata</option>
					<option value="ouro">Ouro</option>
				</select>
			</div>

			<label class="aceite">
				<input type="checkbox" required>
				Aceito os termos e condições.
			</label>

			<input class="botao" type="submit" value="Cadastrar">

		</form>

		<p class="voltar"><a class="botao botao--secundario" href="index.html">VOLTAR</a></p>

	</main>

</body>
</html>
